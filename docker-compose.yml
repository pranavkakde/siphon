version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: siphon-mongodb
    ports:
      - "27017:27017"
    volumes:
      - siphon-mongo-data:/data/db
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      - MONGO_INITDB_DATABASE=siphon

  mongo-express:
    image: mongo-express:latest
    container_name: siphon-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
    depends_on:
      - mongodb

  rabbitmq:
    image: rabbitmq:3-management
    container_name: siphon-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - siphon-rabbitmq-data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  minio:
    image: minio/minio:latest
    container_name: siphon-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - siphon-minio-data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"

  # MinIO client to pre-configure bucket
  minio-init:
    image: minio/mc:latest
    container_name: siphon-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb myminio/siphon-screenshots || true;
      /usr/bin/mc anonymous set public myminio/siphon-screenshots;
      exit 0;
      "

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: siphon-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus exporter metrics port
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:latest
    container_name: siphon-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:latest
    container_name: siphon-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo:latest
    container_name: siphon-tempo
    ports:
      - "3200:3200" # tempo
      - "14250:14250" # jaeger
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: siphon-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana-provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  siphon-mongo-data:
  siphon-rabbitmq-data:
  siphon-minio-data:
