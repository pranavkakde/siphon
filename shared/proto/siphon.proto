syntax = "proto3";

package siphon;

option go_package = "shared/proto/siphon";

import "google/protobuf/timestamp.proto";

// Service definitions
service IngressService {
  rpc StreamTestResults(stream TestResultStreamRequest) returns (TestResultStreamResponse);
}

message TestResultStreamRequest {
  TestSuite test_suite = 1;
  TestCase test_case = 2;
  repeated TestStep test_steps = 3;
}

message TestResultStreamResponse {
  bool success = 1;
  string message = 2;
}

// Data Structures
message TestSuite {
  string id = 1;
  string name = 2;
  string environment = 3;
  string execution_id = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message TestCase {
  string id = 1;
  string suite_id = 2;
  string name = 3;
  enum Status {
    UNKNOWN = 0;
    PASS = 1;
    FAIL = 2;
    SKIPPED = 3;
  }
  Status status = 4;
  int64 duration_ms = 5;
  string error_message = 6;
  string screenshot_url = 7; // MinIO uploaded public screenshot path
  // Enforced idempotency key rule: composite unique payload execution_id + test_case_id
}

message TestStep {
  string name = 1;
  enum Status {
    UNKNOWN = 0;
    PASS = 1;
    FAIL = 2;
    SKIPPED = 3;
  }
  Status status = 2;
  int64 duration_ms = 3;
}
