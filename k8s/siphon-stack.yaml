apiVersion: v1
kind: Namespace
metadata:
  name: siphon

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: siphon-config
  namespace: siphon
data:
  MONGO_URL: "mongodb://mongodb-service.siphon.svc.cluster.local:27017"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq-service.siphon.svc.cluster.local:5672/"
  MINIO_ENDPOINT: "minio-service.siphon.svc.cluster.local:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
  PORT: "8080"
  GRPC_PORT: "50051"

---

# MongoDB Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: siphon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6.0
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: siphon
spec:
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017

---

# RabbitMQ Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: siphon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672
        - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: siphon
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672

---

# MinIO Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: siphon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2023-09-07T02-05-02Z
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        env:
        - name: MINIO_ROOT_USER
          value: "minioadmin"
        - name: MINIO_ROOT_PASSWORD
          value: "minioadmin"
        ports:
        - containerPort: 9000
        - containerPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: siphon
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001

---

# Siphon Ingress API (gRPC stream collector)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siphon-ingress
  namespace: siphon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: siphon-ingress
  template:
    metadata:
      labels:
        app: siphon-ingress
    spec:
      containers:
      - name: siphon-ingress
        image: siphon-ingress:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: siphon-config
        ports:
        - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: siphon-ingress-service
  namespace: siphon
spec:
  type: NodePort
  selector:
    app: siphon-ingress
  ports:
  - port: 50051
    targetPort: 50051
    nodePort: 30051

---

# Siphon Sink Daemon Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siphon-sink
  namespace: siphon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: siphon-sink
  template:
    metadata:
      labels:
        app: siphon-sink
    spec:
      containers:
      - name: siphon-sink
        image: siphon-sink:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: siphon-config

---

# Siphon Stream API (WebSockets & REST)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siphon-stream-api
  namespace: siphon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: siphon-stream-api
  template:
    metadata:
      labels:
        app: siphon-stream-api
    spec:
      containers:
      - name: siphon-stream-api
        image: siphon-stream-api:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: siphon-config
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: siphon-stream-api-service
  namespace: siphon
spec:
  selector:
    app: siphon-stream-api
  ports:
  - port: 8080
    targetPort: 8080

---

# Kubernetes Ingress Configuration for Routing Traffic
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siphon-ingress-rules
  namespace: siphon
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/websocket-services: "siphon-stream-api-service"
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: siphon-stream-api-service
            port:
              number: 8080
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: siphon-stream-api-service
            port:
              number: 8080
